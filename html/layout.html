<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: serif, 'Times New Roman', Times;
            padding: 10px 15px;
            background-color: #ffffff;
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        header,
        footer {
            background-color: orange;
            width: 100%;
            height: 140px;
        }

        .section-label {
            font-size: 13px;
            color: #000;
            padding: 4px 2px;
            margin: 0;
        }

        .grid-container {
            width: 100%;
        }

        .row {
            display: flex;
            width: 100%;
        }

        article {
            flex: 1;
            height: 85px;
            font-size: 12px;
            padding: 3px 5px;
            color: #000;
        }

        .art-green {
            background-color: #008000;
            color: #000000;
        }

        .art-orchid {
            background-color: #da70d6;
        }

        .art-skyblue {
            background-color: #87ceeb;
        }

        .art-pink {
            background-color: #ffb6c1;
        }

        .art-yellow {
            background-color: pink;
        }

        .art-red {
            background-color: green;
        }
    </style>
</head>

<body>

    <h2>layout</h2>

    <header></header>

    <div class="section-label">section 0</div>

    <div class="grid-container">
        <div class="row">
            <article class="art-green">section 1 artical 1</article>
            <article class="art-orchid">section 1 artical 3</article>
            <article class="art-skyblue">section 1 artical 2</article>
        </div>

        <div class="row">
            <article class="art-pink">section 2 artical 4</article>
            <article class="art-yellow">section 2 artical 6</article>
            <article class="art-red">section 2 artical 5</article>
        </div>
    </div>

    <div class="section-label">section 3</div>

    <footer></footer>

</body>

</html>
