<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: serif, 'Times New Roman', Times;
            padding: 10px 15px;
            background-color: #ffffff;
        }

        h2 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        header {
            background-color: #ff7f50; /* Coral Orange */
            width: 100%;
            height: 140px;
        }

        footer {
            background-color: #2a9d8f; /* Teal */
            width: 100%;
            height: 140px;
        }

        .section-label {
            font-size: 13px;
            color: #000;
            padding: 4px 2px;
            margin: 0;
        }

        .grid-container {
            width: 100%;
        }

        .row {
            display: flex;
            width: 100%;
        }

        article {
            flex: 1;
            height: 85px;
            font-size: 12px;
            padding: 3px 5px;
            font-weight: 500;
        }

        .art-1 {
            background-color: #2ecc71; /* Emerald Green */
            color: #000000;
        }

        .art-2 {
            background-color: #9b59b6; /* Amethyst Purple */
            color: #ffffff;
        }

        .art-3 {
            background-color: #3498db; /* Ocean Blue */
            color: #ffffff;
        }

        .art-4 {
            background-color: #f39c12; /* Golden Orange */
            color: #000000;
        }

        .art-5 {
            background-color: #e91e63; /* Rose Pink */
            color: #ffffff;
        }

        .art-6 {
            background-color: #00bcd4; /* Bright Cyan */
            color: #000000;
        }
    </style>
</head>
<body>

    <h2>layout</h2>

    <header></header>

    <div class="section-label">section 0</div>

    <div class="grid-container">
        <div class="row">
            <article class="art-1">section 1 artical 1</article>
            <article class="art-2">section 1 artical 3</article>
            <article class="art-3">section 1 artical 2</article>
        </div>

        <div class="row">
            <article class="art-4">section 2 artical 4</article>
            <article class="art-5">section 2 artical 6</article>
            <article class="art-6">section 2 artical 5</article>
        </div>
    </div>

    <div class="section-label">section 3</div>

    <footer></footer>

</body>
</html>
